//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here
plugins {
    // As of FTC SDK 11.2, the Android application plugin is applied here rather than in
    // build.common.gradle. The version comes from the root build.gradle plugins block.
    id 'com.android.application'
}

//fixed WPIlib version for stability
ext.wpilibVersion = '2025.3.2'

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

//    kotlinOptions {
//        jvmTarget = '1.8'
//    }

    compileSdk 34

    defaultConfig {
        minSdk 24
    }
}

repositories {
    maven { url = 'https://frcmaven.wpi.edu/artifactory/release/' }
}

dependencies {
    // wpiutil   - Sendable, ErrorMessages, BooleanConsumer (used by the command framework)
    // wpimath   - MathUtil, MathSharedStore, controller.PIDController
    // wpiunits  - units.measure.Time (used by Command/Commands/WaitCommand)
    //
    // wpinet is deliberately absent: it is JNI-only and can never load on Android.
    //
    // ejml / quickbuf / jackson are NOT declared. They are only needed by wpimath's Matrix,
    // geometry and trajectory classes, none of which this project uses, and wpimath resolves
    // with no transitive metadata so nothing pulls them in implicitly. If you start using
    // Matrix/Pose2d/TrajectoryUtil you will need to add them back.
    implementation "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
    implementation "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7'
    api "org.ejml:ejml-simple:0.43.1"
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

//    implementation "com.bylazar:ftcontrol:0.6.5"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
